<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- three is served from node_modules by the server: offline on factory PCs, pinned by the lockfile, never a CDN. -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<style>
  :root {
    --bg: #eef0f2; --panel: #ffffff; --ink: #1d2126; --muted: #6b7480; --line: #d9dde2;
    --on: #1f9d55; --out: #2a6fdb; --in: #b7791f; --warn: #c0392b; --forced: #8e44ad; --banner: #f5c400;
    --view: #dfe3e7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181c; --panel: #1d2126; --ink: #e6e9ed; --muted: #8e98a4; --line: #2c3238;
            --on: #3ccf7c; --out: #6aa1ff; --in: #e0a948; --warn: #ff6b5b; --forced: #c38be0; --view: #262b31; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  #banner { background: var(--banner); color: #000; font-weight: 700; text-align: center; padding: 4px; letter-spacing: .05em; }
  main { flex: 1; display: flex; min-height: 0; }
  #view { flex: 1; min-width: 0; position: relative; background: var(--view); }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 12px; pointer-events: none; }
  /* Walk-in view: a crosshair says what a click will press, and the key card says how to get out.
     Both are pointer-transparent - the canvas under them is what is being clicked. */
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { left: 0; top: 8px; width: 18px; height: 2px; }
  #pov-hud { position: absolute; left: 10px; top: 10px; padding: 6px 10px; border-radius: 4px; font: 12px ui-monospace, Consolas, monospace;
             background: rgba(0,0,0,.55); color: #fff; pointer-events: none; white-space: pre; }
  /* The whole side panel hides, so the machine can have the window to itself. This button is the
     way back: without it a hidden panel is a page with no controls at all. */
  #panel-show { position: absolute; right: 10px; top: 10px; }
  aside[hidden] { display: none; }
  aside { width: 450px; max-width: 48vw; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside > * { padding: 8px 12px; }
  header { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; }
  #conn { margin-left: auto; font-size: 12px; }
  #conn.ok { color: var(--on); } #conn.bad { color: var(--warn); }
  /* Fixed height: the hints below it come and go, and every line it gained or lost moved the
     operator panel under the pointer. Buttons that move get pressed by mistake. */
  #status { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; white-space: pre-wrap;
            min-height: 5.6em; }
  #hb { color: var(--warn); font-weight: 600; }
  .cmds { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
  .cmds select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  .cmds select:disabled { opacity: .45; }
  button { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .tablewrap { flex: 1; overflow: auto; padding: 0; }
  table { border-collapse: collapse; width: 100%; font: 12px ui-monospace, Consolas, monospace; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 4px 6px; }
  td { padding: 2px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.dir { width: 1%; } .dir-out { color: var(--out); } .dir-in { color: var(--in); }
  td.src { color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
  td.val { width: 1%; min-width: 60px; }
  tr.on td.val { color: var(--on); font-weight: 700; }
  tr.forced td.val { color: var(--forced); }
  td.frc button { padding: 0 5px; font-size: 11px; }
  td.frc input { width: 54px; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; }
  h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; border-top: 1px solid var(--line); }
  .warn-head { display: flex; align-items: center; gap: 8px; }
  .warn-head button { padding: 1px 8px; font-size: 11px; }
  header button { padding: 1px 8px; font-size: 11px; }
  #warns { list-style: none; margin: 0; max-height: 22vh; overflow: auto; font: 12px ui-monospace, Consolas, monospace; color: var(--warn); }
  #warns li { padding: 1px 0; }
  button.right { margin-left: auto; }
  button:disabled { opacity: .45; cursor: default; }
  /* Operator panel: the machine's selector, pushbuttons and lamps, beside the view (Denso-style
     HMI, rb4axis), hideable. Buttons send edges only; the lit dot is the PLC output. */
  #oppanel { border-bottom: 1px solid var(--line); }
  .op-head { display: flex; align-items: center; gap: 8px; } .op-head h3 { border: 0; }
  #op-body { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 6px; }
  #op-body[hidden] { display: none; }
  .op-btn, .op-lamp { position: relative; padding-left: 22px; user-select: none; touch-action: none; }
  .op-btn::before, .op-lamp::before { content: ""; position: absolute; left: 7px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--c, #888); opacity: .3; }
  .op-btn.lit::before, .op-lamp.lit::before { opacity: 1; box-shadow: 0 0 6px var(--c, #888); }
  .op-btn.down { transform: translateY(1px); border-color: var(--muted); }
  /* A latching mushroom shows its own state: pressed in is a machine that will not start. */
  .op-btn.latched { background: var(--warn); border-color: var(--warn); color: #fff; }
  .op-btn.latched::before { opacity: 1; background: #fff; }
  .op-lamp { padding: 3px 8px 3px 22px; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); }
  .op-dial { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
  .op-dial input { width: 110px; accent-color: var(--out); }
  .op-dial b { font: 12px ui-monospace, Consolas, monospace; min-width: 38px; text-align: right; }
  .sel { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; user-select: none; font-weight: 600; font-size: 11px; }
  .sel span { padding: 4px 8px; }
  .sel.auto .r, .sel:not(.auto) .l { background: var(--out); color: #fff; }
  #editor { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding-block: 8px; }
  #editor[hidden] { display: none; }
  .ed-bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #editor select, #editor input { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
  #ed-msg { min-height: 1.4em; color: var(--muted); font-size: 12px; } #ed-msg.bad { color: var(--warn); }
  #ed-tree { max-height: 24vh; overflow: auto; border: 1px solid var(--line); border-radius: 4px; font: 12px ui-monospace, Consolas, monospace; }
  .ed-row { padding: 2px 6px; cursor: pointer; white-space: nowrap; color: var(--muted); } .ed-row b { color: var(--ink); font-weight: 600; }
  .ed-row:hover { background: var(--bg); } .ed-row.sel { background: var(--out); color: #fff; } .ed-row.sel b { color: #fff; }
  #ed-props h4 { margin: 8px 0 2px; font-size: 12px; color: var(--muted); }
  .ed-f { display: flex; gap: 6px; align-items: center; padding: 1px 0; font-size: 12px; }
  .ed-f > span:first-child { width: 150px; flex: none; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-in { display: flex; gap: 3px; flex: 1; min-width: 0; } .ed-in input[type=text], .ed-in select { flex: 1; min-width: 0; }
  .ed-in input.v3, .ed-in input[type=number] { width: 70px; min-width: 0; }
  .ed-hint { color: var(--muted); margin: 4px 0; }
  #ed-errs { list-style: none; margin: 0; padding: 0; font: 12px ui-monospace, Consolas, monospace; color: var(--warn); }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: auto; max-width: none; height: 50vh; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="banner" hidden>INTERNAL CONTROLLER - not a PLC</div>
<main>
  <div id="view">
    <div id="hint">drag: orbit · right-drag: pan · wheel: zoom · hold a part to jam it · F: walk in · H: hide the panel</div>
    <div id="cross" hidden></div>
    <div id="pov-hud" hidden></div>
    <button id="panel-show" hidden title="show the side panel (H)">panel</button>
  </div>
  <aside>
    <header><b id="scene-name">…</b><span id="conn">connecting…</span><button data-hide="status" title="hide the status block">hide</button></header>
    <div id="status"></div>
    <div id="hb" hidden></div>
    <div class="cmds">
      <select id="scene-pick" title="scene"></select>
      <select id="mode-pick" title="controller"><option value="internal">Internal</option><option value="plc">PLC</option></select>
      <select id="scale-pick" title="world speed: 1/10x to watch, up to 4x to get through a cycle. Always 1x with a PLC">
        <option value="4">4x</option><option value="3">3x</option><option value="2">2x</option>
        <option value="1" selected>1x</option><option value="0.5">1/2x</option><option value="0.25">1/4x</option><option value="0.1">1/10x</option>
      </select>
            <button data-op="run">Run</button><button data-op="stop">Stop</button><button data-op="reset">Reset</button><button id="pov-btn" title="walk into the cell (F)">Walk in</button><button id="shop-btn" title="the workshop around the machine">Workshop</button><button id="panel-hide" title="hide the whole side panel (H)">Hide panel</button><button id="edit-btn" class="right">Edit</button>
    </div>
    <section id="oppanel" hidden>
      <div class="op-head"><h3>operator panel</h3><button id="op-hide" class="right">hide</button></div>
      <div id="op-body"></div>
    </section>
    <section id="editor" hidden>
      <div class="ed-bar"><select id="ed-type" title="component type"></select><button id="ed-add" title="mounts on the selected part">Add</button><button id="ed-dup" title="Ctrl+D">Duplicate</button><button id="ed-del" title="Delete">Delete</button><button id="ed-undo" title="Ctrl+Z">Undo</button><button id="ed-redo" title="Ctrl+Y">Redo</button></div>
      <div class="ed-bar"><button id="ed-move" title="W">Move</button><select id="ed-snap" title="move snap"><option value="1">1 mm</option><option value="5">5 mm</option><option value="10" selected>10 mm</option></select><button id="ed-rot" title="E">Rotate</button><select id="ed-rsnap" title="rotate snap"><option value="15" selected>15°</option><option value="90">90°</option></select><button id="ed-save" class="right" title="Ctrl+S">Save</button></div>
      <div id="ed-msg"></div>
      <div id="ed-tree"></div>
      <div id="ed-props"></div>
      <h3 id="ed-errs-h"></h3>
      <ul id="ed-errs"></ul>
      <datalist id="ed-tags"></datalist>
    </section>
    <h3 id="io-head" class="warn-head">signals<button class="right" data-hide="io-wrap">hide</button></h3>
    <div class="tablewrap" id="io-wrap">
      <table id="io"><thead><tr><th></th><th>tag</th><th>source</th><th>value</th><th>force</th></tr></thead><tbody></tbody></table>
    </div>
    <h3 class="warn-head">warnings<button data-hide="warns">hide</button><button id="warn-clear" class="right">clear</button></h3>
    <ul id="warns"></ul>
  </aside>
</main>
<script type="module" src="/web/app.js"></script>
</body>
</html>
